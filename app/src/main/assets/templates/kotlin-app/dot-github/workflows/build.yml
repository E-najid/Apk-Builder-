name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Build debug APK
        run: ./gradlew assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk

  release:
    # Signed release build — runs only when the app pushed a signing keystore
    # (signing/release.keystore.b64 + signing/signing.properties).
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Decode signing keystore
        if: hashFiles('signing/release.keystore.b64') != ''
        run: base64 -d signing/release.keystore.b64 > /tmp/release.keystore
      - name: Build release APK
        if: hashFiles('signing/release.keystore.b64') != ''
        run: ./gradlew assembleRelease
      - name: Sign release APK
        if: hashFiles('signing/release.keystore.b64') != ''
        run: |
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort | tail -1)"
          IN="$(ls app/build/outputs/apk/release/*unsigned*.apk 2>/dev/null | head -1)"
          if [ -z "$IN" ]; then IN="$(ls app/build/outputs/apk/release/*.apk | head -1)"; fi
          "$BT/apksigner" sign \
            --ks /tmp/release.keystore \
            --ks-pass "pass:$(grep '^storePassword=' signing/signing.properties | cut -d= -f2-)" \
            --ks-key-alias "$(grep '^keyAlias=' signing/signing.properties | cut -d= -f2-)" \
            --key-pass "pass:$(grep '^keyPassword=' signing/signing.properties | cut -d= -f2-)" \
            --out app-release-signed.apk "$IN"
          "$BT/apksigner" verify --print-certs app-release-signed.apk
      - name: Upload signed release APK
        if: hashFiles('signing/release.keystore.b64') != ''
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app-release-signed.apk
