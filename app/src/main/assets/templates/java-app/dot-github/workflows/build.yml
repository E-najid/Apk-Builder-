name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Select APK Build Type'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release
          - both

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
          validate-wrappers: false

      - name: Configure Environment Secrets (.env)
        run: |
          if [ ! -f ".env" ] && [ -f ".env.example" ]; then
            echo "Creating .env from .env.example..."
            cp .env.example .env
          fi

      - name: Ensure Debug Keystore Exists
        run: |
          if [ -f "debug.keystore.base64" ]; then
            echo "Decoding debug.keystore from base64..."
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f "debug.keystore" ]; then
            echo "Generating fallback debug.keystore..."
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Android APK
        run: |
          BUILD_TYPE="${{ github.event.inputs.build_type || 'debug' }}"
          echo "Building APK with target: $BUILD_TYPE"
          if [ "$BUILD_TYPE" == "release" ]; then
            gradle assembleRelease --stacktrace
          elif [ "$BUILD_TYPE" == "both" ]; then
            gradle assembleDebug assembleRelease --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.repository.name }}-APK-${{ github.run_number }}
          path: |
            app/build/outputs/apk/**/*.apk
            .build-outputs/*.apk
            *.apk
          retention-days: 90

      - name: Create GitHub Release & Attach APK (On Tag Push Only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/**/*.apk
            .build-outputs/*.apk
            *.apk
          generate_release_notes: true
          name: Release ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-sign:
    # Signed release APK — runs only when APK Builder pushed a signing
    # keystore (signing/release.keystore.b64 + signing/signing.properties).
    name: Sign release APK
    runs-on: ubuntu-latest
    needs: build
    if: hashFiles('signing/release.keystore.b64') != ''

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
          validate-wrappers: false

      - name: Decode signing keystore
        run: base64 -d signing/release.keystore.b64 > /tmp/release.keystore

      - name: Build release APK
        run: gradle assembleRelease --stacktrace

      - name: Sign release APK
        run: |
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort | tail -1)"
          IN="$(ls app/build/outputs/apk/release/*unsigned*.apk 2>/dev/null | head -1)"
          if [ -z "$IN" ]; then IN="$(ls app/build/outputs/apk/release/*.apk | head -1)"; fi
          "$BT/apksigner" sign \
            --ks /tmp/release.keystore \
            --ks-pass "pass:$(grep '^storePassword=' signing/signing.properties | cut -d= -f2-)" \
            --ks-key-alias "$(grep '^keyAlias=' signing/signing.properties | cut -d= -f2-)" \
            --key-pass "pass:$(grep '^keyPassword=' signing/signing.properties | cut -d= -f2-)" \
            --out app-release-signed.apk "$IN"
          "$BT/apksigner" verify --print-certs app-release-signed.apk

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app-release-signed.apk
          retention-days: 90
