name: Build APK
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Build APK
        run: |
          set -o pipefail
          ./gradlew assembleDebug 2>&1 | tee build-output.log
      - name: Run unit tests
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest 2>&1 | tee test-output.log
      - name: Surface errors as annotations
        if: failure()
        run: |
          for log in build-output.log test-output.log; do
            [ -f "$log" ] || continue
            grep -E "^e: |error: |FAILURE:|What went wrong|Caused by:|Unresolved|Could not |FAILED" "$log" | head -30 | while IFS= read -r line; do
              printf '::error::%s\n' "${line:0:600}"
            done
          done
      - name: Report errors on the PR
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.number }}
        run: |
          {
            echo "### ❌ Build failed — error digest (auto-generated)"
            for log in build-output.log test-output.log; do
              if [ -f "$log" ]; then
                echo ""
                echo "#### \`$log\` — errors"
                echo '```'
                grep -E "^e: |error: |FAILURE:|What went wrong|Caused by:|Unresolved|Could not |FAILED" "$log" | head -60
                echo '```'
                echo ""
                echo "<details><summary>tail of $log</summary>"
                echo ""
                echo '```'
                tail -n 40 "$log"
                echo '```'
                echo "</details>"
              fi
            done
          } > comment.md
          head -c 60000 comment.md > comment-final.md
          gh pr comment "$PR_NUMBER" --body-file comment-final.md
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
