# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# AndroidX package structure.
android.useAndroidX=true
# Kotlin code style for this project: "official" or "obsolete".
kotlin.code.style=official
# Only keep the R class for the current module.
android.nonTransitiveRClass=true

# ---------------------------------------------------------------------------
# GitHub OAuth client ID (one-time setup by the maintainer — end users never
# see or type this; it ships inside the APK so sign-in "just works").
#
# It is a PUBLIC identifier, not a secret — committing it here is safe. (The
# client SECRET must never be committed, and this app never uses one.)
#
# To set it up (2 minutes):
#   1. https://github.com/settings/applications/new  (any name/URLs work)
#   2. Enable "Device Flow" in the app's settings
#   3. Uncomment and fill in your client ID below:
#
# GITHUB_CLIENT_ID=Iv1.xxxxxxxxxxxxxxxx
# ---------------------------------------------------------------------------
